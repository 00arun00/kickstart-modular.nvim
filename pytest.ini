[pytest]
testpaths = tests/python
addopts = -v -ra --strict-markers
markers =
    fast: no installed Neovim plugins or live kernel required
    integration: installed Neovim plugins or real editor behavior
    kernel: scientific Python environment or live Jupyter/debugger required
    lua: scripts executed in headless Neovim
    python: Python scripts and native pytest cases
    manual: excluded interactive checks
