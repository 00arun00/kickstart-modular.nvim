name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - run: make test-setup
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: .test-results/
          include-hidden-files: true

  editor:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, kernel]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/python-requirements.txt
            tests/*requirements*.txt
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - name: Install system test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang luajit ripgrep
          rustup component add rustfmt
          npm install --global tree-sitter-cli@0.26.8
      - name: Set up Python environments
        run: |
          make test-setup
          bash scripts/setup-python.sh
      - name: Set up kernel environment
        if: matrix.suite == 'kernel'
        run: make test-setup-kernel
      - name: Set up editor from lockfile
        run: |
          mkdir -p ~/.config .test-results
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --headless -u NONE -i NONE -l scripts/setup-ci.lua 2>&1 | tee .test-results/setup.log
          git diff --exit-code -- lazy-lock.json
      - name: Run suite
        run: make test SUITE=${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite }}
          path: .test-results/
          include-hidden-files: true
