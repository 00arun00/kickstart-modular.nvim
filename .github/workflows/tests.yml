name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting · Lua
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  fast:
    name: Fast · Lua & Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - run: make test-setup
        id: setup
      - name: Run Lua tests
        id: lua
        run: make test-lua SUITE=fast
      - name: Run Python tests
        id: python
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make test-python SUITE=fast
      - uses: actions/upload-artifact@v4
        id: artifacts
        if: always()
        with:
          name: test-results-fast
          path: .test-results/
          include-hidden-files: true
      - name: Summarize tests
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: python3 scripts/ci-report.py --suite 'fast' --label 'Fast · Lua & Python'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-fast
          path: .ci-reports/*.json
          include-hidden-files: true

  editor:
    name: Editor · plugins & navigation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_SUITE: integration
      TEST_LABEL: Editor · plugins & navigation
    steps: &editor_steps
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/python-requirements.txt
            tests/*requirements*.txt
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - name: Install system test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang luajit ripgrep
          rustup component add rustfmt
          npm install --global tree-sitter-cli@0.26.8
      - name: Install screenshot fonts
        run: |
          curl --fail --location --retry 3 https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FiraCode.zip -o "$RUNNER_TEMP/fonts.zip"
          unzip -q "$RUNNER_TEMP/fonts.zip" -d "$RUNNER_TEMP/test-fonts"
          echo "NVIM_TEST_FONT_DIR=$RUNNER_TEMP/test-fonts" >> "$GITHUB_ENV"
      - name: Set up Python environments
        run: |
          make test-setup
          bash scripts/setup-python.sh
      - name: Set up kernel environment
        if: env.TEST_SUITE == 'kernel'
        run: make test-setup-kernel
      - name: Install ImageMagick 7 for rendering tests
        if: env.TEST_SUITE == 'kernel'
        run: |
          mkdir -p "$RUNNER_TEMP/imagemagick" "$RUNNER_TEMP/test-bin"
          cd "$RUNNER_TEMP/imagemagick"
          curl --fail --location --retry 3 https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-32/ImageMagick-7.1.2-32-gcc-x86_64.AppImage -o imagemagick.AppImage
          echo 'd456cab221b5fc1c396768a026d0a33ee8665f7119c7fea7151b960c69058b21  imagemagick.AppImage' | sha256sum --check
          chmod +x imagemagick.AppImage
          ./imagemagick.AppImage --appimage-extract > /dev/null
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$RUNNER_TEMP/imagemagick/squashfs-root/AppRun" > "$RUNNER_TEMP/test-bin/magick"
          chmod +x "$RUNNER_TEMP/test-bin/magick"
          "$RUNNER_TEMP/test-bin/magick" -version
          echo "$RUNNER_TEMP/test-bin" >> "$GITHUB_PATH"
      - name: Set up editor from lockfile
        id: setup
        run: |
          mkdir -p ~/.config .test-results
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --headless -u NONE -i NONE -l scripts/setup-ci.lua 2>&1 | tee .test-results/setup.log
          git diff --exit-code -- lazy-lock.json
      - name: Run Lua tests
        id: lua
        run: make test-lua SUITE=${{ env.TEST_SUITE }}
      - name: Run Python tests
        id: python
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make test-python SUITE=${{ env.TEST_SUITE }}
      - uses: actions/upload-artifact@v4
        id: artifacts
        if: always()
        with:
          name: test-results-${{ env.TEST_SUITE }}
          path: .test-results/
          include-hidden-files: true
      - name: Summarize tests
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: python3 scripts/ci-report.py --suite '${{ env.TEST_SUITE }}' --label '${{ env.TEST_LABEL }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ env.TEST_SUITE }}
          path: .ci-reports/*.json
          include-hidden-files: true

  kernel:
    name: Python · kernels & rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_SUITE: kernel
      TEST_LABEL: Python · kernels & rendering
    steps: *editor_steps

  result:
    name: CI result
    needs: [format, fast, editor, kernel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
          path: .ci-reports
      - name: Publish CI overview
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-report.py --aggregate --root .ci-reports
