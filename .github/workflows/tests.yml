name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting · Lua
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  fast:
    name: Fast · Lua & Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - run: make test-setup
        id: setup
      - name: Run Lua tests
        id: lua
        run: make test-lua SUITE=fast ARGS="--junitxml=.test-results/lua.xml"
      - name: Run Python tests
        id: python
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make test-python SUITE=fast ARGS="--junitxml=.test-results/python.xml"
      - uses: actions/upload-artifact@v4
        id: artifacts
        if: always()
        with:
          name: test-results-fast
          path: .test-results/
          include-hidden-files: true
      - name: Require both language reports
        if: always()
        run: test -s .test-results/lua.xml && test -s .test-results/python.xml
      - name: Summarize tests
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: .test-results/*.xml
          show: fail, skip
          folded: true

  editor:
    name: Editor · plugins & navigation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_SUITE: integration
    steps: &editor_steps
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - name: Install system test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang luajit ripgrep
          rustup component add rustfmt
          npm install --global tree-sitter-cli@0.26.8
      - name: Install screenshot fonts
        run: |
          curl --fail --location --retry 3 https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FiraCode.zip -o "$RUNNER_TEMP/fonts.zip"
          unzip -q "$RUNNER_TEMP/fonts.zip" -d "$RUNNER_TEMP/test-fonts"
          echo "NVIM_TEST_FONT_DIR=$RUNNER_TEMP/test-fonts" >> "$GITHUB_ENV"
      - name: Set up Python environments
        run: |
          make test-setup
          bash scripts/setup-python.sh
      - name: Set up kernel environment
        if: env.TEST_SUITE == 'kernel'
        run: make test-setup-kernel
      - name: Install ImageMagick 7 for rendering tests
        if: env.TEST_SUITE == 'kernel'
        run: |
          mkdir -p "$RUNNER_TEMP/imagemagick" "$RUNNER_TEMP/test-bin"
          cd "$RUNNER_TEMP/imagemagick"
          curl --fail --location --retry 3 https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-32/ImageMagick-7.1.2-32-gcc-x86_64.AppImage -o imagemagick.AppImage
          echo 'd456cab221b5fc1c396768a026d0a33ee8665f7119c7fea7151b960c69058b21  imagemagick.AppImage' | sha256sum --check
          chmod +x imagemagick.AppImage
          ./imagemagick.AppImage --appimage-extract > /dev/null
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$RUNNER_TEMP/imagemagick/squashfs-root/AppRun" > "$RUNNER_TEMP/test-bin/magick"
          chmod +x "$RUNNER_TEMP/test-bin/magick"
          "$RUNNER_TEMP/test-bin/magick" -version
          echo "$RUNNER_TEMP/test-bin" >> "$GITHUB_PATH"
      - name: Set up editor from lockfile
        id: setup
        run: |
          mkdir -p ~/.config .test-results
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --headless -u NONE -i NONE -l scripts/setup-ci.lua 2>&1 | tee .test-results/setup.log
          git diff --exit-code -- lazy-lock.json
      - name: Run Lua tests
        id: lua
        run: make test-lua SUITE=${{ env.TEST_SUITE }} ARGS="--junitxml=.test-results/lua.xml"
      - name: Run Python tests
        id: python
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make test-python SUITE=${{ env.TEST_SUITE }} ARGS="--junitxml=.test-results/python.xml"
      - name: Repeat Python workflow regressions on the CI runner
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.TEST_SUITE == 'kernel' }}
        run: |
          for attempt in $(seq 1 10); do
            make test SUITE=all FILE='python_tools or test_test_navigation or test_test_output' \
              ARGS="--junitxml=.test-results/python-tools-stability-${attempt}.xml" || exit 1
          done
      - uses: actions/upload-artifact@v4
        id: artifacts
        if: always()
        with:
          name: test-results-${{ env.TEST_SUITE }}
          path: .test-results/
          include-hidden-files: true
      - name: Require both language reports
        if: always()
        run: test -s .test-results/lua.xml && test -s .test-results/python.xml
      - name: Summarize tests
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: .test-results/*.xml
          show: fail, skip
          folded: true

  kernel:
    name: Python · kernels & rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_SUITE: kernel
    steps: *editor_steps

  result:
    name: CI result
    needs: [format, fast, editor, kernel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: ci-results
      - name: Require every suite report
        if: always()
        run: |
          for suite in fast integration kernel; do
            test -s "ci-results/test-results-$suite/lua.xml"
            test -s "ci-results/test-results-$suite/python.xml"
          done
      - name: Publish test overview
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: ci-results/*/*.xml
          show: fail, skip
          folded: true
      - name: Require all checks to pass
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
